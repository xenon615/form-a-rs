[package]
name = "form-a"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"


[profile.release]
codegen-units = 1
opt-level = 'z' # wasm less size.


[dependencies]
console_error_panic_hook = "0.1.7"
gloo-net = "0.7.0"
leptos = { version = "0.8.20", features = ["csr"] }
serde = "1.0.229"
serde_json = "1.0.151"
wasm-bindgen = "0.2.127"
